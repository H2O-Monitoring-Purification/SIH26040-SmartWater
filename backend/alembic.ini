# Alembic configuration for SIH26040 Smart Water System

[alembic]

# Location of migration scripts
script_location = %(here)s/migrations

# Add project root to Python path
prepend_sys_path = .

# Use OS-specific path separator
path_separator = os

# Database URL is loaded from .env through migrations/env.py
sqlalchemy.url =


[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S